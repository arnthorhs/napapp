apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: 
    app: web
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: web
  template:
    metadata: 
      labels:
        app: web
    spec: 
      containers: 
        - name: web
          image: arnthorhs/napapp-web:1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: NAP_SERVICE_URL
              value: http://nap-service:3000
            - name: STATS_SERVICE_URL
              value: http://stats-service:3000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
spec:
  type: LoadBalancer
  selector: 
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nap-service
  labels: 
    app: nap-service
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: nap-service
  template:
    metadata: 
      labels:
        app: nap-service
    spec: 
      containers: 
        - name: nap-service
          image: arnthorhs/napapp-nap-service:1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: STATS_SERVICE_URL
              value: http://stats-service:3000
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URL
---
apiVersion: v1
kind: Service
metadata:
  name: nap-service
  labels:
    app: nap-service
spec:
  type: ClusterIP
  selector: 
    app: nap-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
  labels: 
    app: stats-service
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: stats-service
  template:
    metadata: 
      labels:
        app: stats-service
    spec: 
      containers: 
        - name: stats-service
          image: arnthorhs/napapp-stats-service:1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: NAP_SERVICE_URL
              value: http://nap-service:3000
---
apiVersion: v1
kind: Service
metadata:
  name: stats-service
  labels:
    app: stats-service
spec:
  type: ClusterIP
  selector: 
    app: stats-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          ports:
            - containerPort: 27017
              name: mongodb-port
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-config
              mountPath: /data/configdb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: mongo-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  clusterIP: None
  ports:
    - port: 27017
      targetPort: mongodb-port
  selector:
    app: mongo
