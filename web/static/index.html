<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nap tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Nap tracker</h1>
    <label>Child <input id="child" placeholder="e.g. emma"></label>
    <p><span id="status"></span> <button id="toggle" hidden></button></p>
    <p id="average"></p>
    <p id="daily"></p>
    <h2>Last 7 days</h2>
    <ul id="naps"></ul>
    <p id="error"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
